<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>CoinOsprey Favicon</title>

  <defs>
    <linearGradient id="goldLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9D976"/>
      <stop offset="100%" stop-color="#C9961A"/>
    </linearGradient>

    <linearGradient id="goldRight" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFE59A"/>
      <stop offset="100%" stop-color="#D8A92F"/>
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
        flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Left Wing -->
  <polygon
    points="256,60 56,414 256,324"
    fill="url(#goldLeft)"
    filter="url(#shadow)"
  />

  <!-- Right Wing -->
  <polygon
    points="256,60 456,414 256,324"
    fill="url(#goldRight)"
    filter="url(#shadow)"
  />
</svg>
